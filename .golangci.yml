# golangci-lint v2. The linters of gowaku's .golangci.yml, without the rules
# of its layers, which a library has and an application does not.
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - prealloc
    - revive
    - unconvert
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam # widgets are values, as in gowaku
        - unnamedResult
        - commentedOutCode
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers", "sayRepetitiveInsteadOfStutters"]
        - name: package-comments
        - name: var-naming
        - name: receiver-naming
        - name: unused-parameter
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: indent-error-flow
        - name: superfluous-else
        - name: unexported-return
        - name: time-naming
        - name: context-as-argument
        - name: empty-block
    staticcheck:
      checks: ["all"]
    misspell:
      locale: US
      # lexers.Analyse is the name chroma gives its function.
      ignore-rules:
        - analyse
  exclusions:
    rules:
      # Tests may leave out the errors of what they only set up.
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
          - prealloc

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/bankai-tensei/nople
