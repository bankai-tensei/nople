# Builds the macOS package on a Mac of GitHub when a version is tagged, and
# attaches it to the release of the tag, making the release if there is none
# yet. It can also be run by hand for a tag that is already there. The
# Windows and Linux installers are built with packaging/windows and
# packaging/linux and attached by hand.
#
# It runs on an Intel Mac: the Apple silicon ones are often too busy to take
# the job at all. build.sh cross-compiles the binary for Apple silicon, so
# the package is the same either way.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build the package of, such as v1.0.0
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15-intel
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the package
        run: packaging/macos/build.sh "${TAG#v}"
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "Nople ${TAG#v}" --notes ""
          gh release upload "$TAG" dist/nople-*-macos-setup.pkg --clobber
